<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalle de materia | RISA</title>
<!--
  Documento: Mockup de la vista de detalle de materia (se abre al seleccionar una materia en la retícula)
  Versión: 1
  Fecha de última actualización: 2026-10-28
  Autores: (por completar)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --ink: #1B2430; --muted: #566273; --line: #D5DCE5; --navy: #1B396A;
  --a: #28A745; --c: #007BFF; --r: #DC3545; --d: #FFC107; --p: #6C757D;
  --appbar: #1B396A;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12161C; --surface: #1B212A; --ink: #E8ECF1; --muted: #9AA6B5; --line: #2C3541; --navy: #9DBBEF; --appbar: #0F2444; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }

/* Barra superior (igual que en la retícula) */
.appbar { background: var(--appbar); color: #fff; }
.appbar-in { max-width: 1360px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.marca { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.marca strong { font-size: 1.125rem; letter-spacing: 0.02em; }
.marca span { font-size: 0.8125rem; opacity: 0.8; }
.usuario { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; }
.alumno { max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.btn-menu { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: #fff; cursor: pointer; }
.btn-menu:hover { background: rgba(255, 255, 255, 0.14); }
.btn-menu:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.menu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 10; min-width: 230px; display: flex; flex-direction: column; padding: 6px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; }
.menu[hidden] { display: none; }
.menu a { padding: 10px 12px; border-radius: 6px; color: inherit; text-decoration: none; }
.menu a:hover { background: color-mix(in srgb, var(--navy) 12%, var(--surface)); }
.menu a:focus-visible { outline: 2px solid var(--navy); outline-offset: -2px; }
.menu a[aria-current="page"] { font-weight: 600; color: var(--navy); }
.menu a:last-child { margin-top: 6px; border-top: 1px solid var(--line); border-radius: 0 0 6px 6px; }
@media (max-width: 640px) { .marca span { display: none; } }

.wrap { max-width: 880px; margin: 0 auto; padding: 16px 20px 40px; }
h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; color: var(--navy); }
h2 { margin: 0; font-size: 1.0625rem; font-weight: 700; }
.sub { margin: 0; color: var(--muted); }

/* Regreso a la retícula */
.volver { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 6px; margin-left: -6px; border-radius: 6px; color: var(--navy); font-weight: 600; text-decoration: none; }
.volver:hover { background: color-mix(in srgb, var(--navy) 10%, transparent); }
.volver:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.atajo { margin-left: 4px; font-size: 0.75rem; font-weight: 400; color: var(--muted); }
@media (hover: none) { .atajo { display: none; } }

/* Selector solo para revisar el mockup */
.demo { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0 16px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; font-size: 0.8125rem; color: var(--muted); }
.demo button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.demo button[aria-pressed="true"] { border-color: var(--navy); background: var(--navy); color: var(--surface); font-weight: 600; }

/* Tarjeta principal: el color del borde sigue el estatus, como en la retícula */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.ficha { border-left: 6px solid var(--s, var(--p)); }
.ficha-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 16px; padding: 18px 20px 14px; }
.estatus { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--s); border-radius: 999px; color: var(--ink); font-size: 0.8125rem; font-weight: 600; white-space: nowrap; }
.estatus::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--s); }
.datos { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0; border-top: 1px solid var(--line); }
.datos div { padding: 12px 20px; }
.datos div + div { border-left: 1px solid var(--line); }
.datos dt { font-size: 0.8125rem; color: var(--muted); }
.datos dd { margin: 0; font-size: 1.25rem; font-weight: 700; white-space: nowrap; }
.datos dd small { font-size: 0.8125rem; font-weight: 400; color: var(--muted); }
.nota-estatus { margin: 0; padding: 10px 20px; border-top: 1px solid var(--line); font-size: 0.8125rem; color: var(--muted); }

[data-e="A"] { --s: var(--a); }
[data-e="C"] { --s: var(--c); }
[data-e="R"] { --s: var(--r); }
[data-e="D"] { --s: var(--d); }
[data-e="P"] { --s: var(--p); }

/* Bloque de docente, horario y grupo */
.grupo { margin-top: 16px; }
.panel-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.asignacion { display: grid; grid-template-columns: 1fr auto; gap: 12px 24px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.docente { display: flex; align-items: center; gap: 12px; min-width: 0; }
.avatar { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: color-mix(in srgb, var(--navy) 14%, var(--surface)); color: var(--navy); font-weight: 700; }
.docente small, .grupo-id small { display: block; font-size: 0.8125rem; color: var(--muted); }
.docente strong { display: block; overflow-wrap: anywhere; }
.grupo-id { text-align: right; }
.grupo-id strong { font-size: 1.25rem; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 11px 20px; text-align: left; border-bottom: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: 0.8125rem; font-weight: 600; color: var(--muted); background: color-mix(in srgb, var(--navy) 5%, var(--surface)); }
td.hora { white-space: nowrap; font-variant-numeric: tabular-nums; }
.horas { margin: 0; padding: 10px 20px; border-top: 1px solid var(--line); font-size: 0.8125rem; color: var(--muted); }

/* Mensaje cuando no hay información adicional */
.vacio { display: grid; justify-items: center; gap: 8px; padding: 32px 20px; text-align: center; }
.vacio svg { color: var(--navy); }
.vacio h3 { margin: 0; font-size: 1rem; color: var(--navy); }
.vacio p { max-width: 480px; margin: 0; color: var(--muted); }

.pie { display: flex; justify-content: flex-start; margin-top: 20px; }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 1px solid var(--navy); border-radius: 6px; background: var(--surface); color: var(--navy); font-weight: 600; text-decoration: none; }
.btn:hover { background: color-mix(in srgb, var(--navy) 10%, var(--surface)); }
.btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

/* Celular */
@media (max-width: 640px) {
  .wrap { padding: 12px 16px 32px; }
  h1 { font-size: 1.3125rem; }
  .ficha-h, .panel-h, .asignacion, .nota-estatus, .horas { padding-left: 16px; padding-right: 16px; }
  .datos div { padding: 10px 14px; }
  .datos dd { font-size: 1.0625rem; }
  .asignacion { grid-template-columns: 1fr; }
  .grupo-id { text-align: left; }
  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tbody tr { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  tbody tr:last-child { border-bottom: 0; }
  td { padding: 0; border: 0; }
  td.dia { font-weight: 600; }
  td.hora { text-align: right; }
  td.aula { grid-column: 1 / -1; color: var(--muted); font-size: 0.8125rem; }
  .pie .btn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="marca"><strong>RISA</strong><span>Retícula Interactiva de Seguimiento Académico</span></div>
    <div class="usuario">
      <span class="alumno" id="alumno"></span>
      <button type="button" class="btn-menu" id="btn-menu" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <nav class="menu" id="menu" aria-label="Menú principal" hidden>
        <a href="#" aria-current="page">Retícula</a>
        <a href="#">Recomendación de carga</a>
        <a href="#">Historial académico</a>
        <a href="#">Cerrar sesión</a>
      </nav>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- Regreso: en Laravel apunta a route('reticula.index'). Esc hace lo mismo. -->
  <a href="#" class="volver" id="volver">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Volver a la retícula <span class="atajo">(Esc)</span>
  </a>

  <!-- Solo para la revisión del mockup. Se elimina en producción. -->
  <div class="demo" role="group" aria-label="Vista del mockup">
    Vista del mockup:
    <button type="button" data-vista="con" aria-pressed="true">Con docente y horario</button>
    <button type="button" data-vista="sin" aria-pressed="false">Sin información adicional</button>
  </div>

  <div id="contenido" aria-live="polite"></div>

  <div class="pie">
    <a href="#" class="btn" id="volver-pie">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Volver a la retícula
    </a>
  </div>
</main>

<script>
// Mismos códigos de estatus que la retícula
const ESTATUS = {
  A: ["Aprobada", "Calificación de 70 o más"],
  C: ["Cursando", "Inscrita en este periodo"],
  R: ["Reprobada", "Calificación menor a 70, por repetir"],
  D: ["Disponible", "Ya cumples sus prerrequisitos"],
  P: ["Pendiente", "Faltan prerrequisitos o créditos"]
};

// Datos de ejemplo. grupoAsignado es null cuando no hay docente, horario ni grupo.
const CON_GRUPO = {
  clave: "AEF-1031", nombre: "Fundamentos de Base de Datos", creditos: 5, semestreSugerido: 4, estatus: "C",
  periodo: "Agosto-Diciembre 2026",
  grupoAsignado: {
    grupo: "4A",
    docente: { nombre: "M.C. Laura Hernández Vega", correo: "laura.hernandez@celaya.tecnm.mx" },
    horario: [
      { dia: "Lunes", inicio: "09:00", fin: "11:00", aula: "Edificio F, aula F-12" },
      { dia: "Miércoles", inicio: "09:00", fin: "11:00", aula: "Edificio F, aula F-12" },
      { dia: "Viernes", inicio: "09:00", fin: "10:00", aula: "Laboratorio de Cómputo 3" }
    ]
  }
};
const SIN_GRUPO = {
  clave: "SCD-1015", nombre: "Lenguajes y Autómatas I", creditos: 5, semestreSugerido: 6, estatus: "P",
  periodo: "Agosto-Diciembre 2026",
  grupoAsignado: null
};

// Conexión al backend (opcional). Con null se usan los datos de ejemplo.
// Base: GET /api/materias/{id} → data { clave, nombre, creditos, semestreSugerido, estatus }.
// Campos nuevos que propone este mockup: periodo y grupoAsignado { grupo, docente { nombre, correo }, horario [{ dia, inicio, fin, aula }] }.
// Ejemplo en Laravel: const API_URL = "/api/materias/12";
const API_URL = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iniciales = n => n.replace(/^(M\.?C\.?|Dr\.?|Dra\.?|Ing\.?|Lic\.?)\s+/i, "").split(/\s+/).slice(0, 2).map(p => p[0]).join("").toUpperCase();
const horasSemana = h => h.reduce((s, x) => {
  const [hi, mi] = x.inicio.split(":").map(Number), [hf, mf] = x.fin.split(":").map(Number);
  return s + (hf * 60 + mf - hi * 60 - mi) / 60;
}, 0);

function pintar(m) {
  const [etiqueta, explicacion] = ESTATUS[m.estatus] || ESTATUS.P;
  document.title = m.nombre + " | RISA";

  const ficha =
    '<section class="panel ficha" data-e="' + esc(m.estatus) + '" aria-labelledby="titulo">' +
      '<div class="ficha-h">' +
        '<h1 id="titulo">' + esc(m.nombre) + '</h1>' +
        '<span class="estatus">' + etiqueta + '</span>' +
      '</div>' +
      '<dl class="datos">' +
        '<div><dt>Clave</dt><dd>' + esc(m.clave) + '</dd></div>' +
        '<div><dt>Créditos</dt><dd>' + m.creditos + '</dd></div>' +
        '<div><dt>Semestre</dt><dd>' + m.semestreSugerido + '<small>°</small></dd></div>' +
      '</dl>' +
      '<p class="nota-estatus">Estatus: <strong>' + etiqueta + '</strong>. ' + explicacion + '.</p>' +
    '</section>';

  const g = m.grupoAsignado;
  let bloque;
  if (g && g.docente && g.horario && g.horario.length) {
    bloque =
      '<section class="panel grupo" aria-labelledby="t-grupo">' +
        '<div class="panel-h"><h2 id="t-grupo">Docente, horario y grupo</h2><span class="sub">' + esc(m.periodo) + '</span></div>' +
        '<div class="asignacion">' +
          '<div class="docente">' +
            '<span class="avatar" aria-hidden="true">' + esc(iniciales(g.docente.nombre)) + '</span>' +
            '<div><small>Docente</small><strong>' + esc(g.docente.nombre) + '</strong>' +
              (g.docente.correo ? '<small>' + esc(g.docente.correo) + '</small>' : '') + '</div>' +
          '</div>' +
          '<div class="grupo-id"><small>Grupo</small><strong>' + esc(g.grupo) + '</strong></div>' +
        '</div>' +
        '<table>' +
          '<thead><tr><th scope="col">Día</th><th scope="col">Horario</th><th scope="col">Aula</th></tr></thead>' +
          '<tbody>' + g.horario.map(h =>
            '<tr><td class="dia">' + esc(h.dia) + '</td><td class="hora">' + esc(h.inicio) + '–' + esc(h.fin) + '</td><td class="aula">' + esc(h.aula) + '</td></tr>'
          ).join("") + '</tbody>' +
        '</table>' +
        '<p class="horas">' + horasSemana(g.horario) + ' horas a la semana</p>' +
      '</section>';
  } else {
    bloque =
      '<section class="panel grupo" aria-labelledby="t-grupo">' +
        '<div class="panel-h"><h2 id="t-grupo">Docente, horario y grupo</h2><span class="sub">' + esc(m.periodo) + '</span></div>' +
        '<div class="vacio">' +
          '<svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7.5v.01"/></svg>' +
          '<h3>No hay información adicional de esta materia</h3>' +
          '<p>Todavía no tiene docente, horario ni grupo asignados para ti en este periodo. Esta información aparecerá cuando te inscribas en un grupo.</p>' +
        '</div>' +
      '</section>';
  }

  document.getElementById("contenido").innerHTML = ficha + bloque;
}

if (API_URL) {
  fetch(API_URL, { headers: { Accept: "application/json" }, credentials: "same-origin" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => pintar(j.data))
    .catch(() => {
      document.getElementById("contenido").innerHTML = '<section class="panel"><div class="vacio"><h3>No se pudo cargar la materia</h3><p>Intenta de nuevo en unos minutos o vuelve a la retícula.</p></div></section>';
    });
} else {
  pintar(CON_GRUPO);
}

// Selector del mockup
document.querySelectorAll(".demo button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".demo button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  pintar(b.dataset.vista === "con" ? CON_GRUPO : SIN_GRUPO);
}));

// Nombre del estudiante (ejemplo). En Laravel, usa el nombre del usuario autenticado.
document.getElementById("alumno").textContent = "Ana Sofía Ramírez Torres";

// Menú
const btnMenu = document.getElementById("btn-menu");
const menu = document.getElementById("menu");
const cerrarMenu = () => {
  menu.hidden = true;
  btnMenu.setAttribute("aria-expanded", "false");
  btnMenu.setAttribute("aria-label", "Abrir menú");
};
btnMenu.addEventListener("click", () => {
  const abrir = menu.hidden;
  menu.hidden = !abrir;
  btnMenu.setAttribute("aria-expanded", String(abrir));
  btnMenu.setAttribute("aria-label", abrir ? "Cerrar menú" : "Abrir menú");
});
document.addEventListener("click", e => { if (!menu.hidden && !e.target.closest(".usuario")) cerrarMenu(); });

// Esc cierra el menú si está abierto; si no, regresa a la retícula
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!menu.hidden) { cerrarMenu(); btnMenu.focus(); return; }
  document.getElementById("volver").click();
});
</script>
</body>
</html>
